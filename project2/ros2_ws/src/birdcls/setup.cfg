# Куда класть исполняемые файлы пакета.
#
# ros2 run ищет их строго в install/<пакет>/lib/<пакет>/. Если colcon не передаёт
# setuptools параметр --install-scripts, тот кладёт их в install/<пакет>/bin/ по
# умолчанию, сборка при этом рапортует об успехе, а ros2 run отвечает
# «No executable found». Эти четыре строки задают путь явно и снимают зависимость
# от версии colcon.
[develop]
script_dir=$base/lib/birdcls

[install]
install_scripts=$base/lib/birdcls
